<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LuckyFlow 🌿</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F0E8; --bg2: #EDE7D9; --surface: #FDFAF4; --surface2: #F0EBE0;
  --border: rgba(160,140,110,0.18); --border2: rgba(160,140,110,0.3);
  --text: #2D2A24; --text2: #5C5548; --muted: #9C8F7E; --muted2: #BFB4A4;
  --green: #5A8A6A; --green-soft: rgba(90,138,106,0.12); --green-mid: rgba(90,138,106,0.25);
  --green-glow: rgba(90,138,106,0.2); --sage: #8FAF8A; --sand: #C8A97E;
  --terracotta: #C17B5C; --terracotta-soft: rgba(193,123,92,0.12);
  --accent: #5A8A6A; --accent-soft: rgba(90,138,106,0.1); --water: #6BA3BE;
  --focus: #8B7355; --focus-soft: rgba(139,115,85,0.1); --shadow: 0 2px 16px rgba(100,80,50,0.08);
  --shadow-md: 0 4px 24px rgba(100,80,50,0.12); --warn: #D4845A; --warn-soft: rgba(212,132,90,0.1);
  --crisis: #8B6A6A; --crisis-soft: rgba(139,106,106,0.08); --crisis-border: rgba(139,106,106,0.2);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background: radial-gradient(ellipse 60% 40% at 0% 0%, rgba(90,138,106,0.08) 0%, transparent 60%), radial-gradient(ellipse 50% 35% at 100% 100%, rgba(193,123,92,0.07) 0%, transparent 60%);
}
.app { max-width:460px; margin:0 auto; padding:20px 16px 80px; position:relative; z-index:1; }

/* HEADER */
.header { text-align:center; padding:34px 0 24px; }
.logo { font-family:'Playfair Display',serif; font-size:48px; letter-spacing:-1px; color:var(--text); line-height:1; }
.logo em { color:var(--green); font-style:italic; }
.logo-sub { font-size:11px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-top:7px; }
#date-display { font-size:12px; font-weight:500; color:var(--muted2); margin-top:5px; }

/* CARD */
.card { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:22px; margin-bottom:14px; box-shadow:var(--shadow); }
.card-title { font-size:10px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:18px; display:flex; align-items:center; gap:7px; }

/* MOOD & ENERGY GRID */
.mood-options, .energy-options { display:flex; gap:8px; margin-bottom:14px; }
.mood-opt, .energy-opt {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:13px 6px; border-radius:16px; border:1.5px solid var(--border);
  background:var(--bg2); cursor:pointer; transition:all 0.2s;
}
.mood-opt.selected, .energy-opt.selected { background:var(--accent-soft); border-color:var(--green); transform:translateY(-3px); box-shadow:0 4px 14px var(--green-glow); }
.mood-emoji, .e-icon { font-size:26px; }
.mood-word, .e-label { font-size:9px; font-weight:700; text-transform:uppercase; color:var(--muted); text-align:center; }

/* HISTORY */
.mood-history { margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
.mood-hist-row { display:flex; gap:6px; margin-top:10px; }
.mood-hist-item { width:32px; height:32px; border-radius:9px; background:var(--bg2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:16px; }

/* WATER */
.water-glasses { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.water-glass { width:30px; height:38px; border-radius:3px 3px 8px 8px; border:1.5px solid var(--water); cursor:pointer; position:relative; }
.water-glass.filled { background:var(--water); }

/* SLEEP */
.sleep-row { display:flex; align-items:center; gap:15px; }
.sleep-hrs { font-family:'Playfair Display',serif; font-size:42px; }
.sleep-btn { width:35px; height:35px; border-radius:10px; border:1px solid var(--border2); cursor:pointer; background:var(--surface2); }

/* SUGGESTIONS */
.suggestion-box { margin-top:10px; padding:15px; border-radius:15px; font-size:13px; display:none; }
.suggestion-box.show { display:block; animation:fadeSlide 0.4s ease; }
@keyframes fadeSlide { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo"><em>Lucky</em>Flow 🌿</div>
    <div class="logo-sub">Tvé denní útočiště</div>
    <div id="date-display">---</div>
  </div>

  <div class="card">
    <div class="card-title">✨ Jak ti dnes je?</div>
    <div class="mood-options" id="mood-opts"></div>
    <div id="mood-suggestion" class="suggestion-box" style="background:var(--green-soft); border:1px solid var(--green-mid);"></div>
    <div class="mood-history">
      <div class="card-title" style="margin-bottom:0">Posledních 7 dní</div>
      <div class="mood-hist-row" id="mood-hist"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">⚡ Tvá energie</div>
    <div class="energy-options" id="energy-opts"></div>
    <div id="energy-rec" class="suggestion-box" style="background:var(--accent-soft); border:1px solid var(--green-mid);"></div>
  </div>

  <div class="card">
    <div class="card-title">💧 Pitný režim</div>
    <div class="water-glasses" id="water-glasses"></div>
    <div id="water-count" style="font-size:13px; font-weight:bold; color:var(--water)">0 / 8 sklenic</div>
  </div>

  <div class="card">
    <div class="card-title">🌙 Spánek</div>
    <div class="sleep-row">
      <div class="sleep-hrs" id="sleep-val">7</div>
      <div style="font-size:14px; color:var(--muted)">hodin</div>
      <button class="sleep-btn" onclick="changeSleep(0.5)">+</button>
      <button class="sleep-btn" onclick="changeSleep(-0.5)">-</button>
    </div>
  </div>
</div>

<script>
// DATA A LOGIKA
let state = {
  water: 0,
  sleep: 7.0,
  mood: null,
  energy: null,
  moodHistory: ['😐', '🙂', '😄', '😐', '😔', '🙂'] // Demo data
};

const MOODS = [
  { emoji:'😄', label:'Skvěle', tip: 'Skvělá zpráva! Zkus tu radost dnes poslat dál. ✨' },
  { emoji:'🙂', label:'Dobře', tip: 'Užívej si ten klidný pocit. Je to dobrý den. 🌤' },
  { emoji:'😐', label:'Ujde', tip: 'Někdy je v pořádku být prostě jen "neutrální". 🍃' },
  { emoji:'😔', label:'Nic moc', tip: 'Zkus si dát teplý čaj a na chvíli jen tak být. ☕' },
  { emoji:'😢', label:'Těžce', tip: 'Dnes buď na sebe extra laskavá. Zvládneš to. 💛' }
];

const ENERGIES = [
  { emoji:'⚡', label:'Nabitá', rec: 'Ideální čas na pohyb nebo náročný úkol!' },
  { emoji:'🌤', label:'Dobře', rec: 'Pusť se do práce, půjde ti to od ruky.' },
  { emoji:'😌', label:'Klidně', rec: 'Udržuj tempo, procházka ti prospěje.' },
  { emoji:'🍃', label:'Pomalu', rec: 'Dneska nikam nespěchej, šetři síly.' },
  { emoji:'🪫', label:'Vybitá', rec: 'Okamžitě zvolni. Tvůj úkol je dnes jen odpočinek.' }
];

function render() {
  // Datum
  const d = new Date();
  document.getElementById('date-display').textContent = d.toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long' });

  // Nálada - dlaždice
  const mWrap = document.getElementById('mood-opts');
  mWrap.innerHTML = '';
  MOODS.forEach(m => {
    const btn = document.createElement('div');
    btn.className = `mood-opt ${state.mood === m.emoji ? 'selected' : ''}`;
    btn.innerHTML = `<span class="mood-emoji">${m.emoji}</span><span class="mood-word">${m.label}</span>`;
    btn.onclick = () => { 
      state.mood = m.emoji; 
      const sug = document.getElementById('mood-suggestion');
      sug.textContent = m.tip;
      sug.classList.add('show');
      render(); 
    };
    mWrap.appendChild(btn);
  });

  // Historie nálad (posledních 7 dní)
  const hWrap = document.getElementById('mood-hist');
  hWrap.innerHTML = '';
  state.moodHistory.forEach(emoji => {
    const item = document.createElement('div');
    item.className = 'mood-hist-item';
    item.textContent = emoji;
    hWrap.appendChild(item);
  });

  // Energie - dlaždice
  const eWrap = document.getElementById('energy-opts');
  eWrap.innerHTML = '';
  ENERGIES.forEach((e, idx) => {
    const btn = document.createElement('div');
    btn.className = `energy-opt ${state.energy === idx ? 'selected' : ''}`;
    btn.innerHTML = `<span class="e-icon">${e.emoji}</span><span class="e-label">${e.label}</span>`;
    btn.onclick = () => { 
      state.energy = idx; 
      const rec = document.getElementById('energy-rec');
      rec.textContent = e.rec;
      rec.classList.add('show');
      render(); 
    };
    eWrap.appendChild(btn);
  });

  // Voda
  const wWrap = document.getElementById('water-glasses');
  wWrap.innerHTML = '';
  for(let i=1; i<=8; i++) {
    const g = document.createElement('div');
    g.className = `water-glass ${i <= state.water ? 'filled' : ''}`;
    g.onclick = () => { state.water = i; render(); };
    wWrap.appendChild(g);
  }
  document.getElementById('water-count').textContent = `${state.water} / 8 sklenic`;

  // Spánek
  document.getElementById('sleep-val').textContent = state.sleep.toFixed(1);
}

function changeSleep(val) {
  state.sleep = Math.max(0, state.sleep + val);
  render();
}

render();
</script>

</body>
</html>
