<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LuckyFlow 🌿</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F0E8; --bg2: #EDE7D9; --surface: #FDFAF4; --border: rgba(160,140,110,0.18);
  --text: #2D2A24; --muted: #9C8F7E; --green: #5A8A6A; --accent-soft: rgba(90,138,106,0.1); 
  --water: #6BA3BE; --shadow: 0 2px 16px rgba(100,80,50,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px 16px 40px; }
.app { max-width:460px; margin:0 auto; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:22px; margin-bottom:14px; box-shadow:var(--shadow); }
.card-title { font-size:10px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:18px; }

/* GRID OPTIONS */
.grid-options { display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; margin-bottom:12px; }
.opt-btn { display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 2px; border-radius:14px; border:1.5px solid var(--border); background:var(--bg2); cursor:pointer; }
.opt-btn.selected { background:var(--accent-soft); border-color:var(--green); transform:translateY(-2px); }
.opt-emoji { font-size:22px; }
.opt-label { font-size:8px; font-weight:700; text-transform:uppercase; color:var(--muted); text-align:center; }

/* TIMER */
.timer-modes { display: flex; gap: 8px; margin-bottom: 15px; }
.mode-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg2); cursor: pointer; font-size: 11px; font-weight: bold; }
.mode-btn.active { background: var(--green); color: white; }
.timer-display { text-align: center; margin: 15px 0; }
.time-left { font-family: 'Playfair Display', serif; font-size: 48px; display: block; }
.timer-fact { font-size: 12px; font-style: italic; color: var(--muted); margin-top: 5px; min-height: 34px; }
.main-btn { width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--text); color: white; font-weight: bold; cursor: pointer; }
.main-btn.stop { background: #A66; }

/* HISTORY TABLE */
.history-list { margin-top: 10px; }
.history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.history-date { color: var(--muted); font-size: 11px; }

.water-wrap { display:flex; gap:6px; flex-wrap:wrap; }
.glass { width:28px; height:36px; border:2px solid var(--water); border-radius:4px 4px 10px 10px; cursor:pointer; opacity:0.3; }
.glass.filled { background:var(--water); opacity:1; }
</style>
</head>
<body>

<div class="app">
  <div style="text-align:center; margin-bottom:20px;">
    <h1 style="font-family:'Playfair Display'; font-weight:400;"><em>Lucky</em>Flow 🌿</h1>
  </div>

  <div class="card">
    <div class="card-title">✨ Jak ti dnes je?</div>
    <div class="grid-options" id="mood-grid"></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ Tvá energie</div>
    <div class="grid-options" id="energy-grid"></div>
  </div>

  <div class="card">
    <div class="card-title">⏱️ Focus Timer</div>
    <div class="timer-modes">
      <button class="mode-btn" onclick="setTimer(15)" id="m15">15 min</button>
      <button class="mode-btn" onclick="setTimer(30)" id="m30">30 min</button>
      <button class="mode-btn" onclick="setTimer(45)" id="m45">45 min</button>
    </div>
    <div class="timer-display">
      <span class="time-left" id="time-display">25:00</span>
      <div class="timer-fact" id="timer-fact">Vyber si čas a začni makat!</div>
    </div>
    <button class="main-btn" id="timer-control" onclick="handleTimer()">Start</button>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
    <div class="card">
      <div class="card-title">💧 Voda</div>
      <div class="water-wrap" id="water-grid"></div>
    </div>
    <div class="card">
      <div class="card-title">🌙 Spánek</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span id="sleep-val" style="font-size:20px; font-weight:bold;">7</span>
        <button onclick="addSleep(0.5)" style="border:none; background:none; cursor:pointer;">➕</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📅 Historie (7 dní)</div>
    <div class="history-list" id="history-list"></div>
  </div>
</div>

<script>
let state = JSON.parse(localStorage.getItem('luckyFlowData')) || {
  date: new Date().toDateString(),
  mood: null, energy: null, water: 0, sleep: 7.0,
  history: []
};

let timerEndTime = localStorage.getItem('timerEndTime') || null;
let timerInterval;

const MOODS = [{e:'😄', l:'Skvěle'}, {e:'🙂', l:'Fajn'}, {e:'😐', l:'Ujde'}, {e:'😔', l:'Nic moc'}, {e:'💀', l:'Úplně na nic'}];
const ENERGIES = [{e:'🚀', l:'Turbo'}, {e:'☀️', l:'Nabitý'}, {e:'☕', l:'Pohodinda'}, {e:'☁️', l:'Nic moc'}, {e:'👻', l:'Mrtvolka'}];

const FACTS = {
  15: "Gepard by za tuhle dobu uběhl 28 km, zatímco ty v klidu tvoříš. 🐆",
  30: "Gepard by urazil 55 km. To je jako z Prahy skoro do Příbrami! 💨",
  45: "Gepard už by byl 80 km daleko. Ty budeš mít hotový kus světa! 🌍"
};

function saveData() {
  localStorage.setItem('luckyFlowData', JSON.stringify(state));
}

function setTimer(minutes) {
  if (timerEndTime) return;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('m' + minutes).classList.add('active');
  document.getElementById('time-display').textContent = minutes + ":00";
  document.getElementById('timer-fact').textContent = FACTS[minutes];
}

function handleTimer() {
  const btn = document.getElementById('timer-control');
  if (timerEndTime) {
    // STOP
    clearInterval(timerInterval);
    timerEndTime = null;
    localStorage.removeItem('timerEndTime');
    btn.textContent = "Start";
    btn.classList.remove('stop');
    document.getElementById('timer-fact').textContent = "Pauza je taky důležitá.";
  } else {
    // START
    const mins = parseInt(document.querySelector('.mode-btn.active')?.id.replace('m', '') || 15);
    const duration = mins * 60 * 1000;
    timerEndTime = Date.now() + duration;
    localStorage.setItem('timerEndTime', timerEndTime);
    startInterval();
    btn.textContent = "Zastavit";
    btn.classList.add('stop');
  }
}

function startInterval() {
  timerInterval = setInterval(() => {
    const remaining = timerEndTime - Date.now();
    if (remaining <= 0) {
      clearInterval(timerInterval);
      timerEndTime = null;
      localStorage.removeItem('timerEndTime');
      document.getElementById('time-display').textContent = "00:00";
      document.getElementById('timer-control').textContent = "Hotovo! ✨";
      alert("Skvělá práce! Focus blok dokončen.");
    } else {
      const m = Math.floor(remaining / 60000);
      const s = Math.floor((remaining % 60000) / 1000);
      document.getElementById('time-display').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    }
  }, 1000);
}

function init() {
  // Check if day changed
  if (state.date !== new Date().toDateString()) {
    state.history.unshift({ d: state.date, m: state.mood || '?' });
    if (state.history.length > 7) state.history.pop();
    state.date = new Date().toDateString();
    state.mood = null; state.energy = null; state.water = 0;
    saveData();
  }

  // Render Moods
  const mg = document.getElementById('mood-grid');
  MOODS.forEach(m => {
    const b = document.createElement('div');
    b.className = `opt-btn ${state.mood === m.e ? 'selected' : ''}`;
    b.innerHTML = `<span class="opt-emoji">${m.e}</span><span class="opt-label">${m.l}</span>`;
    b.onclick = () => { state.mood = m.e; saveData(); location.reload(); };
    mg.appendChild(b);
  });

  // Render History
  const hlist = document.getElementById('history-list');
  state.history.forEach(i => {
    hlist.innerHTML += `<div class="history-item"><span class="history-date">${i.d.split(' ').slice(0,3).join(' ')}</span><span>${i.m}</span></div>`;
  });

  // Render Water
  const wg = document.getElementById('water-grid');
  for(let i=1; i<=8; i++) {
    const g = document.createElement('div');
    g.className = `glass ${i <= state.water ? 'filled' : ''}`;
    g.onclick = () => { state.water = i; saveData(); location.reload(); };
    wg.appendChild(g);
  }

  // Energy & Sleep
  const eg = document.getElementById('energy-grid');
  ENERGIES.forEach(e => {
    const b = document.createElement('div');
    b.className = `opt-btn ${state.energy === e.e ? 'selected' : ''}`;
    b.innerHTML = `<span class="opt-emoji">${e.e}</span><span class="opt-label">${e.l}</span>`;
    b.onclick = () => { state.energy = e.e; saveData(); location.reload(); };
    eg.appendChild(b);
  });
  document.getElementById('sleep-val').textContent = state.sleep;

  // Restore Timer
  if (timerEndTime) {
    document.getElementById('timer-control').textContent = "Zastavit";
    document.getElementById('timer-control').classList.add('stop');
    startInterval();
  }
}

function addSleep(v) { state.sleep += v; saveData(); document.getElementById('sleep-val').textContent = state.sleep; }

init();
</script>
</body>
</html>
