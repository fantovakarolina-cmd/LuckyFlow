<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LuckyFlow 🌿</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F0E8; --bg2: #EDE7D9; --surface: #FDFAF4; --surface2: #F0EBE0;
  --border: rgba(160,140,110,0.18); --border2: rgba(160,140,110,0.3);
  --text: #2D2A24; --text2: #5C5548; --muted: #9C8F7E; --muted2: #BFB4A4;
  --green: #5A8A6A; --green-soft: rgba(90,138,106,0.12); --green-mid: rgba(90,138,106,0.25);
  --green-glow: rgba(90,138,106,0.2); --sage: #8FAF8A; --sand: #C8A97E;
  --terracotta: #C17B5C; --terracotta-soft: rgba(193,123,92,0.12);
  --accent: #5A8A6A; --accent-soft: rgba(90,138,106,0.1); --water: #6BA3BE;
  --focus: #8B7355; --focus-soft: rgba(139,115,85,0.1); --shadow: 0 2px 16px rgba(100,80,50,0.08);
  --shadow-md: 0 4px 24px rgba(100,80,50,0.12); --warn: #D4845A; --warn-soft: rgba(212,132,90,0.1);
  --crisis: #8B6A6A; --crisis-soft: rgba(139,106,106,0.08); --crisis-border: rgba(139,106,106,0.2);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background: radial-gradient(ellipse 60% 40% at 0% 0%, rgba(90,138,106,0.08) 0%, transparent 60%), radial-gradient(ellipse 50% 35% at 100% 100%, rgba(193,123,92,0.07) 0%, transparent 60%);
}
.app { max-width:460px; margin:0 auto; padding:20px 16px 80px; position:relative; z-index:1; }
.header { text-align:center; padding:34px 0 24px; }
.logo { font-family:'Playfair Display',serif; font-size:48px; letter-spacing:-1px; color:var(--text); line-height:1; }
.logo em { color:var(--green); font-style:italic; }
.logo-sub { font-size:11px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-top:7px; }
#date-display { font-size:12px; font-weight:500; color:var(--muted2); margin-top:5px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:22px; margin-bottom:14px; box-shadow:var(--shadow); }
.card-title { font-size:10px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:18px; display:flex; align-items:center; gap:7px; }
.section-divider { display:flex; align-items:center; gap:12px; margin:22px 0 14px; }
.section-divider-line { flex:1; height:1px; background:var(--border2); }
.section-divider-text { font-family:'Playfair Display',serif; font-size:13px; font-style:italic; color:var(--muted); }
.mood-options, .energy-options { display:flex; gap:8px; margin-bottom:4px; }
.mood-opt, .energy-opt { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:13px 6px; border-radius:16px; border:1.5px solid var(--border); background:var(--bg2); cursor:pointer; transition:all 0.2s; }
.mood-opt.selected, .energy-opt.selected { background:var(--accent-soft); border-color:var(--green); transform:translateY(-3px); box-shadow:0 4px 14px var(--green-glow); }
.mood-emoji, .e-icon { font-size:24px; }
.mood-word, .e-label { font-size:9px; font-weight:700; text-transform:uppercase; color:var(--muted); }
.timer-ring-wrap { position:relative; width:150px; height:150px; margin:0 auto 18px; }
.timer-svg { width:150px; height:150px; transform:rotate(-90deg); }
.timer-track { fill:none; stroke:var(--border); stroke-width:6; }
.timer-progress { fill:none; stroke:var(--focus); stroke-width:6; stroke-linecap:round; stroke-dasharray:440; stroke-dashoffset:440; transition:0.3s; }
.timer-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.timer-time { font-family:'Playfair Display',serif; font-size:38px; color:var(--focus); }
.water-glasses { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.water-glass { width:30px; height:40px; border:2px solid var(--water); border-radius:4px 4px 10px 10px; cursor:pointer; position:relative; overflow:hidden; opacity:0.3; }
.water-glass.filled { opacity:1; background:var(--water); }
.sleep-row { display:flex; align-items:center; gap:15px; }
.sleep-hrs { font-size:40px; font-family:'Playfair Display',serif; }
.btn-t { padding:12px; border-radius:12px; border:none; cursor:pointer; width:100%; font-weight:bold; }
.btn-start { background:var(--green); color:white; }
.notes-area { width:100%; height:100px; border-radius:12px; border:1px solid var(--border); padding:10px; font-family:inherit; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo"><em>Lucky</em>Flow 🌿</div>
    <div class="logo-sub">Tvůj prostor pro klid</div>
    <div id="date-display">---</div>
  </div>

  <div class="section-divider"><div class="section-divider-line"></div><div class="section-divider-text">Nálada</div><div class="section-divider-line"></div></div>
  <div class="card">
    <div class="card-title">✨ Jak ti dnes je?</div>
    <div class="mood-options" id="mood-opts"></div>
    <div id="mood-suggestion" style="margin-top:10px; font-size:14px; color:var(--text2)"></div>
  </div>

  <div class="section-divider"><div class="section-divider-line"></div><div class="section-divider-text">Voda</div><div class="section-divider-line"></div></div>
  <div class="card">
    <div class="card-title">💧 Pitný režim</div>
    <div class="water-glasses" id="water-glasses"></div>
    <div id="water-count" style="font-weight:bold; color:var(--water)">0 / 8 sklenic</div>
  </div>

  <div class="section-divider"><div class="section-divider-line"></div><div class="section-divider-text">Čas pro tebe</div><div class="section-divider-line"></div></div>
  <div class="card">
    <div class="timer-ring-wrap">
      <svg class="timer-svg"><circle class="timer-track" cx="75" cy="75" r="70"/><circle id="timer-ring" class="timer-progress" cx="75" cy="75" r="70"/></svg>
      <div class="timer-center"><div class="timer-time" id="timer-time">25:00</div></div>
    </div>
    <button class="btn-t btn-start" onclick="toggleTimer()" id="timer-btn">Soustředit se</button>
  </div>

  <div class="section-divider"><div class="section-divider-line"></div><div class="section-divider-text">Poznámka</div><div class="section-divider-line"></div></div>
  <div class="card">
    <textarea id="notes-area" class="notes-area" placeholder="Co ti dnes udělalo radost?"></textarea>
  </div>
</div>

<script>
let state = { water: 0, mood: null, timerRunning: false, timeLeft: 1500 };

const MOODS = [
  { emoji:'😄', label:'Skvěle' }, { emoji:'🙂', label:'Fajn' }, 
  { emoji:'😐', label:'Ujde' }, { emoji:'😔', label:'Nic moc' }, { emoji:'😢', label:'Těžko' }
];

function render() {
  const d = new Date();
  document.getElementById('date-display').textContent = d.toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long' });

  // Moods
  const mWrap = document.getElementById('mood-opts');
  mWrap.innerHTML = '';
  MOODS.forEach(m => {
    const div = document.createElement('div');
    div.className = `mood-opt ${state.mood === m.emoji ? 'selected' : ''}`;
    div.innerHTML = `<span class="mood-emoji">${m.emoji}</span><span class="mood-word">${m.label}</span>`;
    div.onclick = () => { state.mood = m.emoji; render(); };
    mWrap.appendChild(div);
  });

  // Water
  const wWrap = document.getElementById('water-glasses');
  wWrap.innerHTML = '';
  for(let i=1; i<=8; i++) {
    const glass = document.createElement('div');
    glass.className = `water-glass ${i <= state.water ? 'filled' : ''}`;
    glass.onclick = () => { state.water = i; render(); };
    wWrap.appendChild(glass);
  }
  document.getElementById('water-count').textContent = `${state.water} / 8 sklenic`;
}

let timerInt;
function toggleTimer() {
  const btn = document.getElementById('timer-btn');
  if(state.timerRunning) {
    clearInterval(timerInt);
    state.timerRunning = false;
    btn.textContent = "Pokračovat";
  } else {
    state.timerRunning = true;
    btn.textContent = "Pauza";
    timerInt = setInterval(() => {
      state.timeLeft--;
      const m = Math.floor(state.timeLeft / 60);
      const s = state.timeLeft % 60;
      document.getElementById('timer-time').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
      const offset = 440 - (state.timeLeft / 1500) * 440;
      document.getElementById('timer-ring').style.strokeDashoffset = offset;
      if(state.timeLeft <= 0) { clearInterval(timerInt); alert("Čas vypršel, odpočiň si! 🌸"); }
    }, 1000);
  }
}

render();
</script>
</body>
</html>
