<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LuckyFlow 🌿</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F0E8; --bg2: #EDE7D9; --surface: #FDFAF4; --border: rgba(160,140,110,0.18);
  --text: #2D2A24; --muted: #9C8F7E; --green: #5A8A6A; --accent-soft: rgba(90,138,106,0.1); 
  --water: #6BA3BE; --shadow: 0 2px 16px rgba(100,80,50,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px 16px 40px; }
.app { max-width:460px; margin:0 auto; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:22px; margin-bottom:14px; box-shadow:var(--shadow); }
.card-title { font-size:10px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:18px; }

.grid-options { display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; margin-bottom:12px; }
.opt-btn { display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 2px; border-radius:14px; border:1.5px solid var(--border); background:var(--bg2); cursor:pointer; transition: 0.2s; }
.opt-btn.selected { background:var(--accent-soft); border-color:var(--green); transform:translateY(-2px); }
.opt-emoji { font-size:22px; }
.opt-label { font-size:8px; font-weight:700; text-transform:uppercase; color:var(--muted); text-align:center; }

.suggestion { padding:12px; border-radius:12px; font-size:13px; margin-top:10px; display:none; background:var(--green-soft); color:var(--text2); line-height: 1.4; border: 1px solid var(--border); background: #fdfdfd; }
.suggestion.show { display:block; animation: fadeIn 0.3s; }

.timer-modes { display: flex; gap: 8px; margin-bottom: 15px; }
.mode-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg2); cursor: pointer; font-size: 11px; font-weight: bold; }
.mode-btn.active { background: var(--green); color: white; }
.timer-display { text-align: center; margin: 15px 0; }
.time-left { font-family: 'Playfair Display', serif; font-size: 48px; display: block; }
.timer-fact { font-size: 11px; font-style: italic; color: var(--muted); margin-top: 5px; min-height: 34px; }

.water-wrap { display:flex; gap:5px; flex-wrap:wrap; }
.glass { width:25px; height:34px; border:2px solid var(--water); border-radius:3px 3px 8px 8px; cursor:pointer; opacity:0.25; }
.glass.filled { background:var(--water); opacity:1; }

.sleep-ctrl { display:flex; align-items:center; gap:12px; }
.sleep-btn { width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:white; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:bold; }

.history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.main-btn { width: 100%; padding: 15px; border-radius: 15px; border: none; background: var(--text); color: white; font-weight: bold; cursor: pointer; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div class="app">
  <div style="text-align:center; margin-bottom:24px;">
    <h1 style="font-family:'Playfair Display'; font-weight:400; font-size:32px;"><em>Lucky</em>Flow 🌿</h1>
    <div id="date-now" style="font-size:12px; color:var(--muted); margin-top:4px;"></div>
  </div>

  <div class="card">
    <div class="card-title">✨ Jak ti dnes je?</div>
    <div class="grid-options" id="mood-grid"></div>
    <div id="mood-tip" class="suggestion"></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ Tvá energie</div>
    <div class="grid-options" id="energy-grid"></div>
    <div id="energy-tip" class="suggestion"></div>
  </div>

  <div class="card">
    <div class="card-title">⏱️ Focus Timer</div>
    <div class="timer-modes">
      <button class="mode-btn" onclick="setTimer(15)" id="m15">15 min</button>
      <button class="mode-btn" onclick="setTimer(30)" id="m30">30 min</button>
      <button class="mode-btn" onclick="setTimer(45)" id="m45">45 min</button>
    </div>
    <div class="timer-display">
      <span class="time-left" id="time-display">25:00</span>
      <div class="timer-fact" id="timer-fact">Vyber si čas a začni makat!</div>
    </div>
    <button class="main-btn" id="timer-control" onclick="handleTimer()">Start</button>
  </div>

  <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 12px;">
    <div class="card">
      <div class="card-title">💧 Voda (10x)</div>
      <div class="water-wrap" id="water-grid"></div>
    </div>
    <div class="card">
      <div class="card-title">🌙 Spánek</div>
      <div class="sleep-ctrl">
        <button class="sleep-btn" onclick="addSleep(-0.5)">-</button>
        <span id="sleep-val" style="font-weight:bold; min-width:30px; text-align:center;">7</span>
        <button class="sleep-btn" onclick="addSleep(0.5)">+</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📅 Historie (7 dní)</div>
    <div id="history-list"></div>
  </div>
</div>

<script>
let state = JSON.parse(localStorage.getItem('luckyFlowData')) || {
  date: new Date().toDateString(),
  mood: null, energy: null, water: 0, sleep: 7.0,
  history: []
};

let timerEndTime = localStorage.getItem('timerEndTime') || null;
let timerInterval;

const MOODS = [
  {e:'😄', l:'Skvěle', t:'To je ono! Užívej si tuhle vlnu. ✨'},
  {e:'🙂', l:'Fajn', t:'Hezký, vyrovnaný den. 🌤'},
  {e:'😐', l:'Ujde', t:'Někdy je fajn prostě jenom být. 🍃'},
  {e:'😔', l:'Nic moc', t:'Zkus se na chvíli zastavit a nadechnout. ☕'},
  {e:'💀', l:'Úplně na nic', t:'Dneska na sebe buď extra hodná. Zvládneš to. 💛'}
];

const ENERGIES = [
  {e:'🚀', l:'Turbo', t:'Máš sílu na všechno! Využij toho naplno. 🔥'},
  {e:'☀️', l:'Nabitý', t:'Skvělý čas na práci nebo pohyb. 💪'},
  {e:'☕', l:'Pohodinda', t:'Ideální tempo na běžný den. 🧘'},
  {e:'☁️', l:'Nic moc', t:'Zvolni, dneska se nikam neženeš. 🍃'},
  {e:'👻', l:'Mrtvolka', t:'Tělo si říká o pauzu. Dej si klid a čaj. 🌙'}
];

const FACTS = {
  15: "Gepard by za tuhle dobu uběhl 28 km. Ty zatím v klidu tvoř! 🐆",
  30: "Gepard by urazil 55 km. To je jako z Prahy skoro do Příbrami! 💨",
  45: "Gepard už by byl 80 km daleko. Ty budeš mít hotový kus práce! 🌍"
};

function saveData() { localStorage.setItem('luckyFlowData', JSON.stringify(state)); }

function setTimer(m) {
  if (timerEndTime) return;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('m'+m).classList.add('active');
  document.getElementById('time-display').textContent = m + ":00";
  document.getElementById('timer-fact').textContent = FACTS[m];
}

function handleTimer() {
  const btn = document.getElementById('timer-control');
  if (timerEndTime) {
    clearInterval(timerInterval); timerEndTime = null;
    localStorage.removeItem('timerEndTime');
    btn.textContent = "Start"; btn.style.background = "var(--text)";
  } else {
    const mins = parseInt(document.querySelector('.mode-btn.active')?.id.replace('m','') || 15);
    timerEndTime = Date.now() + (mins * 60 * 1000);
    localStorage.setItem('timerEndTime', timerEndTime);
    startInterval();
    btn.textContent = "Zastavit"; btn.style.background = "#A66";
  }
}

function startInterval() {
  timerInterval = setInterval(() => {
    const remaining = timerEndTime - Date.now();
    if (remaining <= 0) {
      clearInterval(timerInterval); timerEndTime = null;
      localStorage.removeItem('timerEndTime');
      document.getElementById('time-display').textContent = "00:00";
      alert("Hotovo! ✨");
    } else {
      const m = Math.floor(remaining/60000); const s = Math.floor((remaining%60000)/1000);
      document.getElementById('time-display').textContent = `${m}:${s<10?'0':''}${s}`;
    }
  }, 1000);
}

function render() {
  document.getElementById('date-now').textContent = new Date().toLocaleDateString('cs-CZ', { weekday:'long', day:'numeric', month:'long' });
  
  // Moods & Energy with Tips
  const setupGrid = (id, data, stateKey, tipId) => {
    const g = document.getElementById(id); g.innerHTML = '';
    data.forEach(item => {
      const b = document.createElement('div');
      b.className = `opt-btn ${state[stateKey] === item.e ? 'selected' : ''}`;
      b.innerHTML = `<span class="opt-emoji">${item.e}</span><span class="opt-label">${item.l}</span>`;
      b.onclick = () => { 
        state[stateKey] = item.e; 
        const tip = document.getElementById(tipId);
        tip.textContent = item.t; tip.classList.add('show');
        saveData(); render(); 
      };
      g.appendChild(b);
    });
  };

  setupGrid('mood-grid', MOODS, 'mood', 'mood-tip');
  setupGrid('energy-grid', ENERGIES, 'energy', 'energy-tip');

  // 10 Glasses
  const wg = document.getElementById('water-grid'); wg.innerHTML = '';
  for(let i=1; i<=10; i++) {
    const g = document.createElement('div'); g.className = `glass ${i<=state.water?'filled':''}`;
    g.onclick = () => { state.water = i; saveData(); render(); };
    wg.appendChild(g);
  }

  // History & Sleep
  document.getElementById('sleep-val').textContent = state.sleep;
  const hlist = document.getElementById('history-list'); hlist.innerHTML = '';
  state.history.slice(0, 7).forEach(i => {
    hlist.innerHTML += `<div class="history-item"><span style="color:var(--muted)">${i.d.split(' ').slice(1,3).join(' ')}</span><span>${i.m}</span></div>`;
  });
}

function addSleep(v) { state.sleep = Math.max(0, state.sleep + v); saveData(); render(); }

// Init
if (state.date !== new Date().toDateString()) {
  state.history.unshift({ d: state.date, m: state.mood || '?' });
  state.date = new Date().toDateString(); state.mood = null; state.energy = null; state.water = 0;
  saveData();
}
if (timerEndTime) startInterval();
render();
</script>
</body>
</html>
