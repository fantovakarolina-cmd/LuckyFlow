<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LuckyFlow 🌿</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F0E8; --bg2: #EDE7D9; --surface: #FDFAF4; --border: rgba(160,140,110,0.18);
  --text: #2D2A24; --muted: #9C8F7E; --green: #5A8A6A; --accent-soft: rgba(90,138,106,0.1); 
  --water: #6BA3BE; --shadow: 0 2px 16px rgba(100,80,50,0.08); --error: #A66;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px 16px 60px; }
.app { max-width:460px; margin:0 auto; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:22px; margin-bottom:14px; box-shadow:var(--shadow); }
.card-title { font-size:10px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:18px; }

.grid-options { display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; margin-bottom:12px; }
.opt-btn { display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 2px; border-radius:14px; border:1.5px solid var(--border); background:var(--bg2); cursor:pointer; transition: 0.2s; }
.opt-btn.selected { background:var(--accent-soft); border-color:var(--green); transform:translateY(-2px); }
.opt-emoji { font-size:22px; }
.opt-label { font-size:8px; font-weight:700; text-transform:uppercase; color:var(--muted); text-align:center; }

.timer-modes { display: flex; gap: 8px; margin-bottom: 15px; }
.mode-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg2); cursor: pointer; font-size: 11px; font-weight: bold; }
.mode-btn.active { background: var(--green); color: white; }
.timer-display { text-align: center; margin: 15px 0; }
.time-left { font-family: 'Playfair Display', serif; font-size: 48px; display: block; }
.timer-fact { font-size: 11px; font-style: italic; color: var(--muted); margin-top: 5px; min-height: 34px; }

.timer-controls { display: flex; gap: 10px; }
.main-btn { flex: 2; padding: 15px; border-radius: 15px; border: none; background: var(--text); color: white; font-weight: bold; cursor: pointer; }
.stop-btn { flex: 1; padding: 15px; border-radius: 15px; border: 1px solid var(--border); background: white; color: var(--error); font-weight: bold; cursor: pointer; display: none; }

.water-wrap { display:flex; gap:5px; flex-wrap:wrap; margin-bottom: 8px; }
.glass { width:25px; height:34px; border:2px solid var(--water); border-radius:3px 3px 8px 8px; cursor:pointer; opacity:0.25; }
.glass.filled { background:var(--water); opacity:1; }

.sleep-ctrl { display:flex; align-items:center; gap:12px; }
.sleep-btn { width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:white; cursor:pointer; display:flex; align-items:center; justify-content:center; font-weight:bold; }

.summary-text { font-size: 14px; line-height: 1.6; color: var(--text2); font-style: italic; }
.history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.reset-zone { margin-top: 40px; text-align: center; }
.full-reset-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 10px 20px; border-radius: 12px; font-size: 11px; cursor: pointer; opacity: 0.6; }
.full-reset-btn:hover { opacity: 1; background: #fff; color: var(--error); border-color: var(--error); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<div class="app">
  <div style="text-align:center; margin-bottom:24px;">
    <h1 style="font-family:'Playfair Display'; font-weight:400; font-size:32px;"><em>Lucky</em>Flow 🌿</h1>
    <div id="date-now" style="font-size:12px; color:var(--muted); margin-top:4px;"></div>
  </div>

  <div class="card">
    <div class="card-title">✨ Jak ti dnes je?</div>
    <div class="grid-options" id="mood-grid"></div>
  </div>

  <div class="card">
    <div class="card-title">⚡ Tvá energie</div>
    <div class="grid-options" id="energy-grid"></div>
  </div>

  <div class="card">
    <div class="card-title">⏱️ Focus Timer</div>
    <div class="timer-modes">
      <button class="mode-btn" onclick="setTimer(15)" id="m15">15 min</button>
      <button class="mode-btn" onclick="setTimer(30)" id="m30">30 min</button>
      <button class="mode-btn" onclick="setTimer(45)" id="m45">45 min</button>
    </div>
    <div class="timer-display">
      <span class="time-left" id="time-display">25:00</span>
      <div class="timer-fact" id="timer-fact">Vyber si čas a začni makat!</div>
    </div>
    <div class="timer-controls">
        <button class="main-btn" id="timer-start" onclick="startTimer()">Start</button>
        <button class="stop-btn" id="timer-stop" onclick="stopTimer()">Stop</button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
    <div class="card">
      <div class="card-title">💧 Voda</div>
      <div class="water-wrap" id="water-grid"></div>
      <div style="font-size: 10px; color: var(--muted); margin-top: 5px;">Cíl: 10 sklenic</div>
    </div>
    <div class="card">
      <div class="card-title">🌙 Spánek</div>
      <div class="sleep-ctrl">
        <button class="sleep-btn" onclick="addSleep(-0.5)">-</button>
        <span id="sleep-val" style="font-weight:bold;">7</span>
        <button class="sleep-btn" onclick="addSleep(0.5)">+</button>
      </div>
      <div style="font-size: 10px; color: var(--muted); margin-top: 5px;">hodin spánku</div>
    </div>
  </div>

  <div class="card" style="background: var(--bg2); border: 1px dashed var(--muted);">
    <div class="card-title">📝 Shrnutí tvého dne</div>
    <div id="daily-summary" class="summary-text">Začni klikat...</div>
  </div>

  <div class="card">
    <div class="card-title">📅 Historie (7 dní)</div>
    <div id="history-list"></div>
  </div>

  <div class="reset-zone">
      <button class="full-reset-btn" onclick="fullReset()">Smazat všechna data a historii</button>
  </div>
</div>

<script>
let state = JSON.parse(localStorage.getItem('luckyFlowData')) || {
  date: new Date().toDateString(),
  mood: null, energy: null, water: 0, sleep: 7.0, focusTime: 0,
  history: []
};

let timerEndTime = localStorage.getItem('timerEndTime') || null;
let currentMins = 15;
let timerInterval;

const MOODS = [
  {e:'😄', l:'Skvěle', s:'Dnes se cítíš skvěle.'},
  {e:'🙂', l:'Fajn', s:'Máš příjemný den.'},
  {e:'😐', l:'Ujde', s:'Tvůj den plyne neutrálně.'},
  {e:'😔', l:'Nic moc', s:'Dnes je to náročnější.'},
  {e:'💀', l:'Úplně na nic', s:'Procházíš těžkým dnem.'}
];

const ENERGIES = [
  {e:'🚀', l:'Turbo', s:'máš turbo pohon'},
  {e:'☀️', l:'Nabitý', s:'jsi plná síly'},
  {e:'☕', l:'Pohodinda', s:'udržuješ si pohodu'},
  {e:'☁️', l:'Nic moc', s:'baterky jsou na dně'},
  {e:'👻', l:'Mrtvolka', s:'tělo volá po spánku'}
];

function saveData() { localStorage.setItem('luckyFlowData', JSON.stringify(state)); }

function setTimer(m) {
  if (timerEndTime) return;
  currentMins = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('m'+m).classList.add('active');
  document.getElementById('time-display').textContent = m + ":00";
  const facts = {15: "28 km", 30: "55 km", 45: "80 km"};
  document.getElementById('timer-fact').textContent = `Gepard by za tuhle dobu uběhl ${facts[m]}. 🐆`;
}

function startTimer() {
  if (timerEndTime) return;
  state.focusTime += currentMins;
  timerEndTime = Date.now() + (currentMins * 60 * 1000);
  localStorage.setItem('timerEndTime', timerEndTime);
  runTimer();
  saveData();
  render();
}

function stopTimer() {
  clearInterval(timerInterval);
  timerEndTime = null;
  localStorage.removeItem('timerEndTime');
  document.getElementById('time-display').textContent = currentMins + ":00";
  document.getElementById('timer-start').style.display = "block";
  document.getElementById('timer-stop').style.display = "none";
  document.getElementById('timer-fact').textContent = "Časovač byl zastaven.";
}

function runTimer() {
  document.getElementById('timer-start').style.display = "none";
  document.getElementById('timer-stop').style.display = "block";
  
  timerInterval = setInterval(() => {
    const remaining = timerEndTime - Date.now();
    if (remaining <= 0) {
      stopTimer();
      alert("Blok soustředění dokončen! ✨");
    } else {
      const m = Math.floor(remaining/60000); const s = Math.floor((remaining%60000)/1000);
      document.getElementById('time-display').textContent = `${m}:${s<10?'0':''}${s}`;
    }
  }, 1000);
}

function fullReset() {
    if(confirm("Opravdu chceš smazat úplně všechna data, včetně historie posledních 7 dní?")) {
        localStorage.clear();
        location.reload();
    }
}

function render() {
  document.getElementById('date-now').textContent = new Date().toLocaleDateString('cs-CZ', { weekday:'long', day:'numeric', month:'long' });
  
  // Mood & Energy grids
  const renderGrid = (id, data, key) => {
    const g = document.getElementById(id); g.innerHTML = '';
    data.forEach(d => {
      const b = document.createElement('div');
      b.className = `opt-btn ${state[key] === d.e ? 'selected' : ''}`;
      b.innerHTML = `<span class="opt-emoji">${d.e}</span><span class="opt-label">${d.l}</span>`;
      b.onclick = () => { state[key] = d.e; saveData(); render(); };
      g.appendChild(b);
    });
  };
  renderGrid('mood-grid', MOODS, 'mood');
  renderGrid('energy-grid', ENERGIES, 'energy');

  // Water 10x
  const wg = document.getElementById('water-grid'); wg.innerHTML = '';
  for(let i=1; i<=10; i++) {
    const g = document.createElement('div'); g.className = `glass ${i<=state.water?'filled':''}`;
    g.onclick = () => { state.water = i; saveData(); render(); };
    wg.appendChild(g);
  }

  document.getElementById('sleep-val').textContent = state.sleep;

  // Dynamic Summary
  const mObj = MOODS.find(m => m.e === state.mood);
  const eObj = ENERGIES.find(e => e.e === state.energy);
  let summary = `Dnes jsi vypila ${state.water} sklenic a spala ${state.sleep} hodin. `;
  if(mObj || eObj) summary = `${mObj ? mObj.s : 'Den plyne'} a ${eObj ? eObj.s : 'hledáš energii'}. ` + summary;
  if(state.focusTime > 0) summary += `<br><strong>Celkem se dnes soustředíš ${state.focusTime} minut! 🌿</strong>`;
  document.getElementById('daily-summary').innerHTML = summary;

  // History List
  const hl = document.getElementById('history-list'); hl.innerHTML = '';
  state.history.slice(0, 7).forEach(h => {
    hl.innerHTML += `<div class="history-item"><span style="color:var(--muted)">${h.d.split(' ').slice(1,3).join(' ')}</span><span>${h.m}</span></div>`;
  });
}

function addSleep(v) { state.sleep = Math.max(0, state.sleep + v); saveData(); render(); }

// Check new day
if (state.date !== new Date().toDateString()) {
  state.history.unshift({ d: state.date, m: state.mood || '?' });
  state.date = new Date().toDateString(); state.mood = null; state.energy = null; state.water = 0; state.focusTime = 0;
  saveData();
}

if (timerEndTime) runTimer();
render();
setTimer(15);
</script>
</body>
</html>
